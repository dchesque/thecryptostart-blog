name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # The build needs *something* in DATABASE_URL for prisma generate.
      # Real prod URL is set in the deploy step (out of scope here).
      DATABASE_URL: postgresql://noop:noop@localhost:5432/noop
      NEXTAUTH_SECRET: ci-placeholder
      AUTH_SECRET: ci-placeholder
      ADMIN_API_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test -- --ci --reporters=default

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  mcp:
    name: MCP server — type-check + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONS_STEP_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Show repo layout
        run: |
          set -x
          pwd
          ls -la
          ls -la mcp-server || true
          node --version
          npm --version

      - name: Install
        working-directory: mcp-server
        run: |
          set -x
          npm ci --verbose 2>&1 | tail -50

      - name: Type-check
        working-directory: mcp-server
        run: npx tsc -p . --noEmit

      - name: Test
        working-directory: mcp-server
        run: npm test

      - name: Build
        working-directory: mcp-server
        run: npm run build
